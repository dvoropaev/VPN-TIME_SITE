<?xml version="1.0" encoding="utf-8"?>
<svg width="800px" height="800px"
   viewBox="0 0 36 36"
   xmlns="http://www.w3.org/2000/svg"
   aria-hidden="true" role="img"
   class="iconify iconify--twemoji"
   preserveAspectRatio="xMidYMid meet">

  <!-- Черный фон флага -->
  <rect x="2" y="6" width="32" height="24" rx="3" ry="3" fill="#000000"/>

  <!-- Перекрещенные кости -->
  <path d="M9 12 L27 30"
     stroke="#FFFFFF"
     stroke-width="2.2"
     stroke-linecap="round"/>
  <path d="M27 12 L9 30"
     stroke="#FFFFFF"
     stroke-width="2.2"
     stroke-linecap="round"/>

  <!-- Череп -->
  <circle cx="18" cy="16" r="5" fill="#FFFFFF"/>

  <!-- Глазницы -->
  <circle cx="16" cy="15" r="1.2" fill="#000000"/>
  <circle cx="20" cy="15" r="1.2" fill="#000000"/>

  <!-- Нос (перевернутый треугольник) -->
  <path d="M18 16.5 L17.2 18 L18.8 18 Z" fill="#000000"/>

  <!-- Нижняя челюсть -->
  <rect x="15" y="19" width="6" height="3" fill="#FFFFFF"/>

  <!-- Намёк на зубы -->
  <path d="M16.5 19 L16.5 22
     M18   19 L18   22
     M19.5 19 L19.5 22"
     stroke="#000000"
     stroke-width="0.6"
     stroke-linecap="round"/>

  </svg>